# Pulse-Ware startup applications

exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = hypridle

# Wallpaper daemon; add your preferred wallpaper to wallpapers/ and edit this line.
exec-once = swww-daemon
exec-once = sleep 1 && swww img ~/.config/hypr/wallpapers/pulse.png --transition-type fade --transition-duration 1

# Clipboard history daemon if installed.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
