background {
    monitor =
    path = ~/.config/hypr/wallpapers/pulse.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.65
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    inner_color = rgba(9,9,11,0.85)
    outer_color = rgba(208,0,43,0.9)
    font_color = rgb(238,238,238)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password</span>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(255,255,255,0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255,255,255,0.65)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 15
    halign = center
    valign = center
}
