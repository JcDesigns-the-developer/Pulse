background {
    monitor =
    path = ~/.config/hypr/wallpapers/pulse-ghost.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 1
    inner_color = rgba(5,5,5,0.90)
    outer_color = rgba(245,245,245,0.95)
    font_color = rgb(245,245,245)
    fade_on_empty = false
    placeholder_text = <span foreground="#888888">ENTER PASSWORD</span>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(245,245,245,0.95)
    font_size = 72
    font_family = DejaVu Sans Mono
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(245,245,245,0.65)
    font_size = 18
    font_family = DejaVu Sans Mono
    position = 0, 15
    halign = center
    valign = center
}
