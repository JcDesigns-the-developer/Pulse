# Pulse-Ware — Hyprland main configuration
# Modular by design. Edit monitors.conf first on a new machine.

$terminal = kitty
$filemanager = kitty --start-as=fullscreen --hold ranger
$menu = rofi -show drun

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/startup.conf

$mod = SUPER

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8
    active_opacity = 0.97
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
    }
}

animations {
    enabled = true
    bezier = pulse, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, pulse, slide
    animation = windowsOut, 1, 5, pulse, popin 80%
    animation = border, 1, 5, pulse
    animation = fade, 1, 5, pulse
    animation = workspaces, 1, 5, pulse, slide
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 1
}

cursor {
    inactive_timeout = 5
    hide_on_key_press = true
}

ecosystem {
    enforce_permissions_check = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
